[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paa_context"
version = "0.1.0"
description = "Recuperacao de contexto para IA generativa em materiais educacionais abertos (AV1, PAA 2026.2, PROCC/UFS)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
# C1, C2 e C3 nao usam biblioteca externa. Estas servem ao C4 (referencia), as figuras e aos testes.
dev = [
    "pytest==8.3.4",
    "scikit-learn==1.6.1",
    "matplotlib==3.10.0",
    "numpy==2.2.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

